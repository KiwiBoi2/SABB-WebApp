<!-- page extends to template.html -->
{% extends "template.html" %} {% block title %} Create Post {% endblock %}

<!-- post page content -->
{% block content %} 
<h1 class="post-create-title">Suggest Something</h1> 
<img class="img-background" src="/static/images/dog.jpg" alt="Placeholder"/>
    <div class="create-post-container">
        <div class="card-backing">
            <form method="POST" class="create-post">
                <!-- blog title form -->
                <label for="title">Recommendation Name</label>
                <input type="text" id="title" name="title" class="form-control" placeholder="Suggestion name here..."/>
                <br/>
                <!-- blog content text area -->
                <textarea name="content" id="content" class="form-control" placeholder="Additional information here..."></textarea> 
                <br/>
                <!-- submit button-->
                <div align="center">
                <button class="btn btn-primary" type="submit">Submit Recommendation</button>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
